<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NavGraphEdit</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <link rel="stylesheet" href="style.css"/>

</head>
<body>

    <div id="outdoor-map"></div>
    <div id="indoor-map" class="hidden"></div>

    <div id="toolbar">
        <button id="mode-outdoor-btn">Outdoor</button>
        <button id="mode-indoor-btn">Indoor</button>

        <select id="building-select" class="hidden"></select>
        <div id="floor-controls" class="hidden">
            <button id="floor-prev-btn">Floor -</button>
            <span id="active-floor-label">+00</span>
            <button id="floor-next-btn">Floor +</button>
        </div>

        <button id="tool-select">Select</button>
        <button id="tool-node">Node</button>
        <button id="tool-edge">Edge</button>
        <button id="export-btn">Export</button>
        <button id="load-btn">Load</button>

        <label id="version-label">
            Version:
            <input id="graph-version-input" type="number" min="1" value="1">
        </label>

        <button id="decrement-version-btn">-1</button>
        <button id="increment-version-btn">+1</button>

        <button id="toggle-portals-menu-btn" style="margin-left: auto; background-color: #4A90E2; color: white;">Portal Edge Menu</button>
        
        <input type="file" id="import-input" style="display:none" accept=".json">
    </div>

    <div id="portal-edge-banner" class="hidden">
        <span>Portal Edge: Select second Node</span>
        <button id="portal-edge-cancel-btn">Cancel (Esc)</button>
    </div>

    <div id="portal-edges-container" class="hidden" style="margin-top: 20px; padding: 10px; border-top: 2px solid #ccc;">
        <h3>Existing Portal Edges</h3>
        <div id="portal-edges-list" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 5px; background: #fff;">
            </div>
    </div>

    <div id="info-panel" class="hidden">
        <div id="info-header">
            <span id="info-title"></span>
            <button id="delete-btn">Delete</button>
        </div>
        <div id="info-content"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
